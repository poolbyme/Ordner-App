# Haelt die Nebenkosten-App wach.
#
# Kostenlose Streamlit-Apps werden nach rund zwoelf Stunden ohne Besucher
# schlafen gelegt. Beim naechsten Oeffnen steht dann minutenlang "Ihre App wird
# gebacken" - bei dieser App besonders lange, weil sie beim Start pandas und
# die PDF-Erzeugung mitlaedt.
#
# Drei Dinge reichen dafuer nicht, alle drei ausprobiert:
#  * Ein blosser Aufruf der Adresse (curl). Streamlit zaehlt keine HTTP-
#    Aufrufe, sondern echte Browser-Sitzungen.
#  * Nur die Seite oeffnen. Eine schlafende App zeigt erst eine Zwischenseite
#    mit dem Knopf "Yes, get this app back up!" - ohne Druck darauf wacht sie
#    nicht auf.
#  * Nur die aeussere Seite durchsuchen. Streamlit Cloud steckt die App in
#    einen eigenen Rahmen unter /~/+/; die aeussere Seite selbst ist leer.
#    Genau daran ist der zweite Lauf gescheitert: fuenf Minuten gewartet, und
#    im Protokoll stand "Was auf der Seite stand:" und dann nichts.
#
# Deshalb: richtiger Browser, in allen Rahmen suchen, Knopf druecken, warten.
name: App wach halten

on:
  schedule:
    # Alle sechs Stunden. Die Grenze liegt bei etwa zwoelf - die Haelfte davon
    # laesst Luft, falls ein Lauf ausfaellt oder sich verspaetet.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # von Hand ausloesbar, Reiter "Actions"

permissions:
  contents: read

jobs:
  wecken:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser einrichten
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Seite wirklich besuchen
        env:
          ADRESSE: https://nebenkosten-komjagin.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import time

          from playwright.sync_api import sync_playwright

          ADRESSE = os.environ["ADRESSE"]
          GESUCHT = "nebenkosten"
          WECKTEXT = re.compile("get this app back up", re.I)
          FRIST = 360          # Sekunden, die die App zum Hochfahren bekommt


          def rahmentexte(seite):
              """Text jedes Rahmens - die App steckt nicht in der aeusseren Seite."""
              for rahmen in seite.frames:
                  try:
                      yield rahmen, rahmen.inner_text("body") or ""
                  except Exception:
                      continue


          def weckknopf(seite):
              for rahmen in seite.frames:
                  try:
                      knopf = rahmen.get_by_role("button", name=WECKTEXT)
                      if knopf.count():
                          return knopf.first
                  except Exception:
                      continue
              return None


          with sync_playwright() as p:
              browser = p.chromium.launch()
              seite = browser.new_context().new_page()
              seite.goto(ADRESSE, wait_until="load", timeout=120_000)

              gedrueckt = 0
              ende = time.time() + FRIST
              steht = False
              while time.time() < ende:
                  if any(GESUCHT in text.lower() for _, text in rahmentexte(seite)):
                      steht = True
                      break
                  knopf = weckknopf(seite)
                  if knopf is not None and gedrueckt < 3:
                      gedrueckt += 1
                      print(f"Die App schlief - Weckknopf gedrueckt ({gedrueckt}).")
                      try:
                          knopf.click()
                      except Exception as fehler:
                          print(f"(Knopf liess sich nicht druecken: {fehler})")
                  seite.wait_for_timeout(5_000)

              if not steht:
                  print("::error::Die App war nach sechs Minuten nicht erreichbar.")
                  print(f"Seitentitel: {seite.title()!r}")
                  for rahmen, text in rahmentexte(seite):
                      kurz = " ".join(text.split())[:200]
                      print(f"  Rahmen {rahmen.url} -> {kurz!r}")
                  browser.close()
                  sys.exit(1)

              print("Die App steht.")
              # Kurz stehen bleiben: Die Sitzung soll als Besuch zaehlen.
              seite.wait_for_timeout(20_000)
              browser.close()
          PY
