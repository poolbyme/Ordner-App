# Haelt die Nebenkosten-App wach.
#
# Kostenlose Streamlit-Apps werden nach rund zwoelf Stunden ohne Besucher
# schlafen gelegt. Beim naechsten Oeffnen steht dann minutenlang "Ihre App wird
# gebacken" - bei dieser App besonders lange, weil sie beim Start pandas und
# die PDF-Erzeugung mitlaedt.
#
# Zwei Dinge reichen dafuer nicht, beide ausprobiert:
#  * Ein blosser Aufruf der Adresse (curl). Streamlit zaehlt keine HTTP-
#    Aufrufe, sondern echte Browser-Sitzungen.
#  * Nur die Seite oeffnen. Eine schlafende App zeigt erst eine Zwischenseite
#    mit dem Knopf "Yes, get this app back up!" - ohne Druck darauf wacht sie
#    nicht auf. Genau daran ist der erste Lauf gescheitert.
#
# Deshalb: richtiger Browser, Knopf druecken, warten bis die App steht.
name: App wach halten

on:
  schedule:
    # Alle sechs Stunden. Die Grenze liegt bei etwa zwoelf - die Haelfte davon
    # laesst Luft, falls ein Lauf ausfaellt oder sich verspaetet.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # von Hand ausloesbar, Reiter "Actions"

permissions:
  contents: read

jobs:
  wecken:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser einrichten
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Seite wirklich besuchen
        env:
          ADRESSE: https://nebenkosten-komjagin.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from playwright.sync_api import sync_playwright

          adresse = os.environ["ADRESSE"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              seite = browser.new_context().new_page()
              seite.goto(adresse, wait_until="load", timeout=180_000)

              # Schlaeft die App, kommt zuerst eine Zwischenseite mit einem Knopf.
              # Ohne Druck darauf bleibt sie liegen. Der Text ist englisch, egal
              # welche Sprache das Geraet hat.
              for versuch in range(3):
                  knopf = seite.get_by_role(
                      "button", name=re.compile("get this app back up", re.I))
                  if knopf.count() == 0:
                      break
                  print(f"Die App schlief - Weckknopf gedrueckt (Versuch {versuch + 1}).")
                  knopf.first.click()
                  seite.wait_for_timeout(15_000)

              # Jetzt warten, bis die App wirklich steht. Das Hochfahren dauert
              # bei dieser App laenger als bei kleinen, sie laedt viel mit.
              try:
                  seite.wait_for_selector("text=Nebenkosten", timeout=300_000)
              except Exception as fehler:
                  print("::error::Die App war nach fuenf Minuten nicht erreichbar.")
                  print(f"Meldung: {fehler}")
                  print("Was auf der Seite stand:")
                  try:
                      print(seite.inner_text("body")[:600])
                  except Exception as lesefehler:
                      print(f"(nicht lesbar: {lesefehler})")
                  browser.close()
                  sys.exit(1)

              print("Die App steht.")
              # Kurz stehen bleiben: Die Sitzung soll als Besuch zaehlen.
              seite.wait_for_timeout(20_000)
              browser.close()
          PY
